[package]
name = "pixelkit-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pixelkit-raster = { workspace = true }
winit = { workspace = true }
softbuffer = { workspace = true }

# macOS only: the system pasteboard and error beep, behind safe objc2
# wrappers (no unsafe in this workspace). Other platforms keep the
# in-memory fallback in clipboard.rs / platform.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[lints]
workspace = true
