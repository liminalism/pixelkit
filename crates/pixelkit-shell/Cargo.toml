[package]
name = "pixelkit-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pixelkit-raster = { workspace = true }
winit = { workspace = true }
softbuffer = { workspace = true }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"], optional = true }
accesskit = { version = "0.25", optional = true }

# macOS only: the system pasteboard and error beep, behind safe objc2
# wrappers (no unsafe in this workspace). Other platforms keep the
# in-memory fallback in clipboard.rs / platform.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[lints]
workspace = true

[features]
# Publish the application's own semantic tree to platform assistive
# technology through AccessKit. Off by default: a kiosk on a Pi has no
# screen reader, and the adapter is a dependency the counter never pays for.
accessibility = ["dep:accesskit", "dep:accesskit_winit"]
